<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pose Tracking Test</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* The video and the drawing canvas sit on top of each other */
    #stage {
      position: relative;
      width: 640px;
      max-width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    #stage video,
    #stage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* mirror it, like a selfie camera */
    }

    button {
      margin-top: 16px;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      background: #ff2d55;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      background: #555;
      cursor: default;
    }

    #status {
      margin-top: 12px;
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1>Pose Tracking Test</h1>

  <div id="stage">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>

  <button id="startButton" disabled>Loading model...</button>
  <p id="status">Getting things ready...</p>

  <script type="module">
    // 1. Load the MediaPipe library straight from the internet (no install needed)
    import {
      PoseLandmarker,
      FilesetResolver,
      DrawingUtils
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const canvas = document.getElementById("overlay");
    const ctx = canvas.getContext("2d");
    const startButton = document.getElementById("startButton");
    const statusText = document.getElementById("status");

    let poseLandmarker = null;
    let lastVideoTime = -1;

    // 2. Set up the pose tracker
    async function loadModel() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
      );

      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          // The "lite" model is the fastest. Swap "lite" for "full" if you want more accuracy.
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numPoses: 1
      });

      startButton.disabled = false;
      startButton.textContent = "Start camera";
      statusText.textContent = "Model loaded. Click the button to start.";
    }

    // 3. Turn on the webcam when the button is clicked
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480 },
          audio: false
        });
        video.srcObject = stream;

        video.addEventListener("loadeddata", () => {
          // Make the canvas the same size as the camera image
          canvas.width = video.videoWidth;
          canvas.height = video.videoHeight;
          startButton.style.display = "none";
          statusText.textContent = "Step back so your whole body is in frame.";
          trackLoop();
        });
      } catch (err) {
        statusText.textContent =
          "Couldn't open the camera: " + err.message +
          ". Check you allowed camera access, and that the page is on localhost or https.";
      }
    }

    // 4. Every frame: find the body and draw it
    const drawingUtils = new DrawingUtils(ctx);

    function trackLoop() {
      // Only process a new camera frame (skip repeats)
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;

        const result = poseLandmarker.detectForVideo(video, performance.now());

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (result.landmarks.length > 0) {
          const body = result.landmarks[0]; // 33 points on the body

          // Lines between the joints (the "skeleton")
          drawingUtils.drawConnectors(body, PoseLandmarker.POSE_CONNECTIONS, {
            color: "#00e5ff",
            lineWidth: 4
          });

          // Dots on each joint
          drawingUtils.drawLandmarks(body, {
            color: "#ff2d55",
            radius: 4
          });

          // Stage 2 will record THIS: the 3D version of the 33 points
          window.latestWorldLandmarks = result.worldLandmarks[0];

          statusText.textContent = "Tracking your body ✔";
        } else {
          statusText.textContent = "No body found. Step back into the frame.";
        }
      }

      requestAnimationFrame(trackLoop);
    }

    startButton.addEventListener("click", startCamera);
    loadModel().catch((err) => {
      statusText.textContent = "Couldn't load the model: " + err.message;
    });
  </script>
</body>
</html>
