<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dance Studio</title>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <style>
    :root {
      --bg: #0e0e10;
      --card: #18181b;
      --line: #2a2a2e;
      --text: #f4f4f5;
      --muted: #8a8a93;
      --pink: #ff2d55;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 28px 16px;
    }

    h1 { font-size: 22px; margin: 0 0 20px; letter-spacing: -0.02em; }
    h2 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 12px; }

    .card {
      width: 860px;
      max-width: 100%;
      background: var(--card);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
    }

    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .spacer { flex: 1; }
    .label { font-size: 13px; color: var(--muted); }

    select {
      appearance: none;
      background: #222226 url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238a8a93'/></svg>") no-repeat right 12px center;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 34px 10px 14px;
      font-size: 15px;
      min-width: 200px;
    }

    button {
      font: inherit;
      font-size: 14px;
      color: var(--text);
      background: #222226;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 14px;
      cursor: pointer;
    }

    button:hover:not(:disabled) { background: #2c2c31; }
    button:disabled { opacity: 0.35; cursor: default; }

    .icon-btn { width: 42px; height: 42px; padding: 0; font-size: 16px; border-radius: 50%; }
    .chip { font-size: 13px; color: var(--muted); padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; }
    .tiny { font-size: 12px; padding: 4px 8px; border-radius: 8px; color: var(--muted); }

    .segmented {
      display: inline-flex;
      background: #222226;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 3px;
    }

    .segmented button {
      border: none;
      background: transparent;
      padding: 6px 14px;
      border-radius: 7px;
      color: var(--muted);
    }

    .segmented button.active { background: var(--pink); color: #fff; }
    .toggle.on { border-color: var(--pink); color: var(--pink); }

    #timeline {
      display: block;
      width: 100%;
      height: 96px;
      margin: 14px 0;
      border-radius: 10px;
      background: #0b0b0d;
      cursor: pointer;
    }

    /* ---------- Camera + character ---------- */
    .panels { display: flex; gap: 12px; }

    .stage {
      position: relative;
      flex: 1;
      aspect-ratio: 3 / 4;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
    }

    #charStage { background: radial-gradient(ellipse at 50% 30%, #26262c, #0b0b0d 70%); }
    #charStage canvas { display: block; }

    #camStage video,
    #camStage canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    .stage-label {
      position: absolute;
      left: 12px;
      bottom: 10px;
      font-size: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    #bigText {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 110px;
      font-weight: 700;
      text-shadow: 0 0 30px rgba(0,0,0,0.8);
      pointer-events: none;
    }

    #recBadge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--pink);
      font-size: 13px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      display: none;
    }

    .actions { display: flex; justify-content: center; gap: 10px; margin-top: 16px; }

    #mainButton {
      background: var(--pink);
      border: none;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 13px 32px;
      border-radius: 999px;
    }

    #mainButton:hover:not(:disabled) { background: #ff4d6d; }

    #status { margin: 12px 0 0; text-align: center; font-size: 14px; color: var(--muted); min-height: 1.3em; }

    /* Skin picker */
    #skinPicker button.active { border-color: var(--pink); color: var(--pink); }

    /* ---------- My moves ---------- */
    #moveList { display: flex; flex-direction: column; gap: 8px; }

    .move {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      background: #1f1f23;
      border: 1px solid transparent;
      border-radius: 12px;
    }

    .move.playing { border-color: var(--pink); }

    .move input {
      background: transparent;
      border: none;
      color: var(--text);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      width: 160px;
      padding: 2px 0;
    }

    .move input:focus { outline: none; border-bottom: 1px solid var(--pink); }
    .move .meta { font-size: 13px; color: var(--muted); flex: 1; }
    .move .delete { color: var(--muted); }
    .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 10px; }

    .admin { display: none !important; }
    body.is-admin .admin { display: inline-flex !important; }
  </style>
</head>
<body>
  <h1>Dance Studio</h1>

  <!-- ===== SONG ===== -->
  <div class="card">
    <div class="row">
      <select id="songSelect"><option>Loading…</option></select>
      <button id="playSongButton" class="icon-btn" title="Play song" disabled>▶</button>
      <div class="spacer"></div>
      <span id="bpmChip" class="chip">– BPM</span>
      <button id="halfTempo" class="tiny" title="Tempo too fast? Halve it" disabled>½×</button>
      <button id="doubleTempo" class="tiny" title="Tempo too slow? Double it" disabled>2×</button>
    </div>

    <canvas id="timeline" title="Click to choose where your move starts"></canvas>

    <div class="row">
      <span class="label">Length</span>
      <div class="segmented" id="beatsControl">
        <button data-beats="4">4</button>
        <button data-beats="8" class="active">8</button>
        <button data-beats="16">16</button>
      </div>
      <span class="label">beats</span>
      <div class="spacer"></div>
      <button id="clicksToggle" class="toggle" title="Play a click on every beat">Clicks</button>
      <button id="practiseButton" disabled>Practise</button>
    </div>

    <div class="row admin" style="margin-top:12px">
      <span class="label">Beat grid</span>
      <button class="tiny" id="nudgeEarlier">◀ 10ms</button>
      <button class="tiny" id="nudgeLater">10ms ▶</button>
      <button class="tiny" id="copySettings">Copy for songs.json</button>
    </div>
  </div>

  <!-- ===== RECORD ===== -->
  <div class="card">
    <div class="row" style="margin-bottom:12px">
      <div class="spacer"></div>
      <div class="row" id="skinPicker"></div>
    </div>

    <div class="panels">
      <div class="stage" id="camStage">
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div id="recBadge">● REC</div>
        <div id="bigText"></div>
        <span class="stage-label">You</span>
      </div>
      <div class="stage" id="charStage">
        <span class="stage-label" id="charLabel">Character</span>
      </div>
    </div>

    <div class="actions">
      <button id="mainButton" disabled>Loading…</button>
    </div>
    <p id="status"></p>
  </div>

  <!-- ===== MY MOVES ===== -->
  <div class="card">
    <h2>My moves</h2>
    <div id="moveList"><div class="empty">Your recorded moves will appear here</div></div>
  </div>

  <script type="module" src="studio.js"></script>
</body>
</html>
